[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hfl"
version = "0.26.0"
description = "Download, run and try any Hugging Face model on your own machine."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Gabriel Galán Pelayo"}]
keywords = [
    "huggingface",
    "llm",
    "ollama",
    "gguf",
    "local-llm",
    "llama-cpp",
    "mlx",
    "vllm",
    "inference",
    "model-serving",
    "openai-api",
    "self-hosted",
    "ai",
    "transformers",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    # Pinning strategy: floor at a known-good/security-patched version, cap
    # before the next breaking boundary. Upper bounds widened (2026-07) to
    # absorb the minor releases that shipped since 0.14.0 — see the Dependabot
    # PRs — after a full-suite green run. Bump the cap deliberately, not with ~=.
    "typer>=0.15.0,<1.0",
    "rich>=13.0,<16",
    # huggingface_hub 1.x. HFL's code also runs on 2.0 (checked 2026-09-28:
    # the suite, Hub timeouts, offline detection, pull/serve for real), but
    # the cap stays <2.0: tokenizers, transformers 5.x, diffusers and
    # sentence-transformers still require <2.0, and with <3.0 a resolver
    # took hub 2.0 and backtracked [stt]'s tokenizers to 0.13.3, which has
    # no wheel for Python 3.12 and needs a Rust compiler (the local audit's
    # C13). Raise it when they allow 2.x. Floor >=1.5.0: transformers 5.x
    # requires it. See ``test_dependency_pins.py`` for the static guard.
    "huggingface-hub>=1.5.0,<2.0",
    "fastapi>=0.135.0,<0.142",
    # Floor at 1.3.1: 1.0.x–1.2.x carry CVE-2026-48817/48818/54282/54283 +
    # PYSEC-2026-161 (DoS / multipart). Cap at the next major; fastapi carries
    # the precise compatible range.
    "starlette>=1.3.1,<2.0",
    # Floor at 0.0.31: < 0.0.31 carries CVE-2026-42561/53538/53539/53540.
    "python-multipart>=0.0.31",
    "uvicorn[standard]>=0.34.0,<0.55",
    "pydantic>=2.12.0,<2.14",
    "httpx~=0.28.0",
    "pyyaml~=6.0",
    # The memory admission (HFL_MEMORY_BUDGET: what fits, what to unload),
    # the physical-core count llama.cpp runs on and /health's process figures
    # all read psutil. It was never declared: the dev venv had it through an
    # extra, so a plain pip install and the Docker image ran without it and
    # loaded models with no memory check at all (measured in the image: no
    # admission line; with psutil, "budget 85% = 3.3 GB; after load …").
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
# llama-cpp-python requires compilation - install separately if needed.
# Pinned to >=0.3.20 because earlier versions bundle a llama.cpp build
# that doesn't recognise the ``gemma4`` architecture and rejects Gemma 4
# GGUFs at load time with "unknown model architecture".
llama = ["llama-cpp-python>=0.3.20"]

# Vulkan backend — for GPUs outside the CUDA/Metal/MLX path:
# Intel Arc, AMD GPUs without ROCm, integrated graphics with a
# Vulkan 1.2+ driver. Requires the Vulkan SDK on the build host
# (``apt install libvulkan-dev`` on Debian/Ubuntu, ``brew install
# vulkan-headers vulkan-loader`` on macOS — though Metal is the
# better path on Apple Silicon).
#
# Install with::
#
#     CMAKE_ARGS="-DGGML_VULKAN=ON" pip install 'hfl[vulkan]'
#
# References ``[llama]`` so the llama-cpp-python pin lives in one place;
# Vulkan installs side-by-side with the default CPU/Metal build. Wheels
# are not pre-built; pip compiles from source (with the CMAKE_ARGS above).
vulkan = ["hfl[llama]"]

# ROCm backend — explicit AMD HIP path for Instinct/Radeon Pro
# datacentre cards. Requires a ROCm-enabled host (``rocm-llvm``,
# ``rocm-hip-sdk``) and the matching driver.
#
# Install with::
#
#     CMAKE_ARGS="-DGGML_HIPBLAS=ON" pip install 'hfl[rocm]'
#
# Same wheel as ``[llama]`` and ``[vulkan]`` — the difference is the
# CMake flag chosen at build time, not the Python package itself.
rocm = ["hfl[llama]"]
transformers = [
    # HFL targets transformers 5.x paired with huggingface_hub 1.x.
    # Both majors bumped together in late 2025 / early 2026 and share
    # the new httpx-based hub client.
    "transformers>=5.0.0,<6.0",
    "torch>=2.5.0,<3.0",
    "accelerate>=1.13.0,<2.0",
    "sentencepiece>=0.2.0",
    # A response format (JSON, a schema, a grammar) on this backend.
    "hfl[structured]",
    # HFL_TRANSFORMERS_QUANT=8bit|4bit: loading quantized on NVIDIA. No CUDA
    # build for macOS. Resolved with hfl[all] on Linux and Windows (0.50.2).
    "bitsandbytes>=0.45.0,<1.0; sys_platform != 'darwin'",
]
# Upper bounds on the heavy, fast-moving native deps below: they are the
# largest vuln/breakage surface and pre-1.0 ones break by minor. Cap at the
# next major (convention shared with transformers/hub/mlx).
# vLLM: Linux only (its GPU backend; on macOS `[all]` used to build a CPU
# 0.7 from source). Floor at 0.30, which has wheels for x86_64 and aarch64:
# with a low floor the resolver fell back to 0.6.5 whenever another extra
# asked for a newer torch/llguidance, and 0.6.5 has no wheel — `hfl[all]`
# failed building it on Linux arm64 (Linux audit C1).
vllm = ["vllm>=0.30.0,<1.0; sys_platform == 'linux'"]
convert = ["gguf>=0.10.0"]

# TTS support
tts = [
    # Same 5.x pin as the [transformers] extra — see comment there.
    "transformers>=5.0.0,<6.0",
    "torch>=2.5.0,<3.0",
    "torchaudio>=2.2.0,<3.0",
    "soundfile>=0.12.1",
]
coqui = [
    # [codec]: from torch 2.9 coqui-tts needs torchcodec for audio IO and
    # refuses to import without it. HFL's coqui engine supplies the one
    # transformers-4 helper coqui-tts still imports (local audit C5).
    "coqui-tts[codec]>=0.24.0,<1.0",
    "torch>=2.5.0,<3.0",
    "torchaudio>=2.2.0,<3.0",
    "soundfile>=0.12.1",
]
# Audio playback (optional)
audio = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
]

tray = [
    "pystray>=0.19.0",
    # Floor at 12.3.0: 12.2.x and earlier carry 13 advisories, incl. HIGH
    # heap out-of-bounds writes in Image.paste()/crop(), ImageCmsTransform
    # and ImageFilter.RankFilter, plus five decompression-bomb bypasses.
    # HFL only uses PIL to draw the tray icon (api/image_validator.py
    # parses image headers by hand and never hands user bytes to PIL), so
    # none were reachable — this is defence in depth for any future code
    # that does decode a user-supplied image. See local security audit L-15.
    "Pillow>=12.3.0",
]

# Model Context Protocol client/server (Phase 9+). 1.x and 2.x both work:
# 2.x dropped the low-level Server's list_tools()/call_tool() decorators
# (`hfl mcp serve` died with "'Server' object has no attribute 'list_tools'",
# local audit A21), and hfl.mcp.server wires either API; the client reads
# both field names. Not capped below 2 any more: vLLM 0.30 requires mcp 2,
# and the cap made `hfl[all]` fall back to a vLLM with no wheel (Linux audit
# C1). Capped at the next major, whose API is unknown.
mcp = ["mcp>=1.0.0,<3.0"]

# Apple Silicon native backend (Phase 13+ — V2 row 14).
# 0.31.2+ is required for the ``gemma4`` architecture; the same
# line ships with ``transformers>=5`` as a hard dep, which matches
# our main pin. Capped at the next major (mlx-lm convention is pre-1.0,
# fast-moving) rather than the previous razor-thin ``<0.32`` which
# blocked the very next minor for no concrete reason.
mlx = [
    "mlx-lm>=0.31.2,<1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # A response format (JSON, a schema, a grammar) on this backend. Named
    # here, not as hfl[structured]: hatchling flattens a self-reference and
    # drops its marker, so [mlx] installed llguidance on Linux too.
    "llguidance>=1.7.0,<2.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# Structured output (JSON, a JSON schema, a GBNF grammar) on MLX and
# Transformers: llguidance builds the token mask (llama.cpp's own constrained
# decoding is built on it). 1.7 has the API used (LLMatcher, grammar_from,
# the numpy/torch/mlx mask helpers, JSON separators) — and 1.7 is what vLLM
# 0.30 pins (<1.8), so a 1.8 floor made `hfl[all]` fall back to a vLLM with
# no wheel (Linux audit C1). Capped at the next major. Without it those
# backends refuse a response format with a 400.
structured = ["llguidance>=1.7.0,<2.0"]

# LoRA training outside Apple Silicon (`hfl train`): Transformers + PEFT.
# PEFT 0.17+ for transformers 5 (resolved with it: peft 0.21.1, torch 2.14).
train = [
    "hfl[transformers]",
    "peft>=0.17.0,<1.0",
]

# Speech-to-text (Whisper) — Phase 16 / V2 row 16. Prefers
# faster-whisper (CPU+GPU); openai-whisper stays as a fallback.
stt = [
    "faster-whisper>=1.0.0,<2.0",
    # PyAV 19.0.0 (2026-09-29) dropped av.open's `metadata_errors`, which
    # faster-whisper 1.2.1 passes to decode every file: each transcription
    # failed with a TypeError (local audit B32/B54/E8, on an L4). faster-whisper
    # asks only av>=11; capped until a release of it works with 19.
    "av>=11,<19",
]

# Image generation (SDXL / FLUX) — Phase 16 / V2 row 17. Heavy: a
# fresh install drags in ~2 GB of wheels. Opt-in only.
imagegen = [
    "diffusers>=0.30.0,<1.0",
    "torch>=2.5.0,<3.0",
    "safetensors>=0.4.0,<1.0",
    # Floor at 12.3.0: 12.2.x and earlier carry 13 advisories, incl. HIGH
    # heap out-of-bounds writes in Image.paste()/crop(), ImageCmsTransform
    # and ImageFilter.RankFilter, plus five decompression-bomb bypasses.
    # HFL only uses PIL to draw the tray icon (api/image_validator.py
    # parses image headers by hand and never hands user bytes to PIL), so
    # none were reachable — this is defence in depth for any future code
    # that does decode a user-supplied image. See local security audit L-15.
    "Pillow>=12.3.0",
    "accelerate>=1.2.0,<2.0",
]

# OpenTelemetry tracing — Phase 17 / V2 row 24.
otel = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

# ``[llama]`` is left out on Windows: PyPI has no Windows wheel for
# llama-cpp-python, so `pip install "hfl[all]"` failed there without Visual
# Studio's C++ Build Tools (found on a real Windows 10). HFL serves GGUF with
# llama.cpp's own llama-server instead (`winget install ggml.llamacpp`, no
# compiler); `hfl[llama]` still builds it for whoever has the Build Tools.
# Named directly, not as "hfl[llama]; <marker>": hatchling expands a
# self-reference and drops its marker (the built wheel still required it on
# Windows). The same pin as [llama] (tests/test_dependency_pins.py).
all = [
    "hfl[transformers,vllm,convert,tts,coqui,audio,tray,mcp,mlx,stt,imagegen,structured,train]",
    "llama-cpp-python>=0.3.20; sys_platform != 'win32'",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0", "pytest-cov>=4.0", "mypy>=1.10.0", "numpy>=1.24.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
hfl = "hfl.cli.main:cli_main"

[project.urls]
Homepage = "https://ggalancs.github.io/hfl/"
Documentation = "https://ggalancs.github.io/hfl/"
Repository = "https://github.com/ggalancs/hfl"
Issues = "https://github.com/ggalancs/hfl/issues"
Changelog = "https://github.com/ggalancs/hfl/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/hfl"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F/W/I: pycodestyle, pyflakes, warnings, import sorting.
# C4: flake8-comprehensions, PIE: flake8-pie — catch comprehension and
# misc antipatterns. B904: require explicit exception chaining
# (`raise ... from exc` / `from None`) so error causes aren't silently lost.
# The codebase is clean under all of these.
select = ["E", "F", "W", "I", "C4", "PIE", "B904"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=hfl --cov-report=term-missing --cov-report=html --cov-report=xml"
markers = [
    "acceptance: tool-calling acceptance suite (spec §6, T1–T7)",
    "slow: tests that take noticeable wall-clock time (sleeps, concurrency)",
    "integration: tests that exercise filesystem, subprocesses, or system probes",
    "hub_sizes: runs the real hfl.hub.downloader.expected_files (stubbed otherwise)",
]

[tool.coverage.run]
source = ["src/hfl"]
branch = true
# Everything is measured: the CLI, the tray and the TTS engines were left
# out, and the total hid them (main.py alone at 67 %). Their tests run with
# the optional backends faked, as CI has none of them.
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    # Don't require coverage for abstract methods
    "@abstractmethod",
]
# 90 % in total, and in every component (scripts/coverage_by_component.py,
# run by scripts/ci-local.sh and the CI workflows).
fail_under = 90
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false  # Gradually enable
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "hfl.api.*",
    "hfl.cli.commands.*",
]
disallow_untyped_defs = true

# numpy 2.5+ ships PEP 695 ``type X = ...`` statements in its bundled stubs.
# mypy targets py3.10 here (our floor), so it rejects that syntax with
# "Type statement is only supported in Python 3.12 and greater" while parsing
# ``numpy/__init__.pyi`` — a spurious failure in a third-party stub, unrelated
# to HFL's own types. Skip following into numpy; combined with
# ``ignore_missing_imports`` above, numpy symbols resolve to ``Any`` (numpy is
# a test-only [dev] dep, never imported by shipped API/CLI code paths).
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
