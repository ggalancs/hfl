name: Windows tests

# Manual only, like every workflow here: the owner starts it from the
# Actions tab (it costs Actions minutes). HFL's suite has run on macOS and
# Linux; this is the first job to run it on Windows. Tests that need POSIX
# (the fake llama-server run through its shebang, symlinks) skip themselves
# there. Expect the first run to find Windows-only failures — that is its
# purpose.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q -p no:cacheprovider -o faulthandler_timeout=120
