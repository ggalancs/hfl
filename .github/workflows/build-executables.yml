name: Build Executables

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: false
        default: 'dev'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: hfl-linux-x86_64
            arch: x86-64
          # An Intel runner: macos-latest is Apple Silicon, and the 0.22.0
          # "hfl-macos-x86_64" was in fact an arm64 binary.
          - os: macos-15-intel
            platform: macos
            artifact_name: hfl-macos-x86_64
            arch: x86_64
          - os: macos-14
            platform: macos-arm
            artifact_name: hfl-macos-arm64
            arch: arm64
          - os: windows-latest
            platform: windows
            artifact_name: hfl-windows-x86_64
            arch: x86-64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      # llama.cpp is always in the executable: without it no GGUF model runs
      # (the 0.22.0 executables could not run any). Linux and Windows take the
      # prebuilt CPU wheel, built for any x86-64 CPU. macOS builds from
      # source: the prebuilt macOS wheels of 0.3.34 and 0.3.35 are corrupt
      # (Bad CRC-32). On Intel, GGML_NATIVE=OFF so the binary does not need
      # the runner's CPU features; on Apple Silicon the M1 runner is the
      # baseline every Apple Silicon Mac has.
      - name: Install llama-cpp-python (prebuilt, Linux and Windows)
        if: ${{ matrix.platform == 'linux' || matrix.platform == 'windows' }}
        run: pip install --only-binary=llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu "llama-cpp-python>=0.3.20"

      - name: Install llama-cpp-python (from source, macOS)
        if: ${{ matrix.platform == 'macos' || matrix.platform == 'macos-arm' }}
        run: pip install --no-binary=llama-cpp-python "llama-cpp-python>=0.3.20"
        env:
          CMAKE_ARGS: ${{ matrix.platform == 'macos' && '-DGGML_METAL=OFF -DGGML_NATIVE=OFF' || '-DGGML_METAL=ON' }}

      # llama.cpp's llama-server, bundled: GGUF models answer several
      # requests at once with nothing else installed. The pinned release,
      # its sha256 checked, as `hfl install llama-server` fetches it.
      - name: Fetch llama-server
        run: python scripts/fetch_llama_server.py build/llama.cpp

      - name: Build executable
        env:
          HFL_PYI_LLAMA_CPP: build/llama.cpp
        run: |
          pyinstaller hfl.spec --clean

      - name: Test executable (Unix)
        if: matrix.platform != 'windows'
        run: |
          chmod +x dist/hfl
          ./dist/hfl version
          ./dist/hfl --help
          # The architecture the file name promises.
          file dist/hfl | tee /dev/stderr | grep -q "${{ matrix.arch }}"

      - name: Test executable (Windows)
        if: matrix.platform == 'windows'
        run: |
          ./dist/hfl.exe version
          ./dist/hfl.exe --help

      # `version` and `--help` passed for executables that could not run any
      # model. Run one, for real: pull, serve, answer over the three APIs —
      # by the bundled llama-server (the default), then by llama.cpp in
      # process (one request at a time).
      - name: Check the executable runs a model (bundled llama-server)
        run: python scripts/platform_check.py --hfl dist/hfl${{ matrix.platform == 'windows' && '.exe' || '' }} --expect-backend llama-server

      - name: Check the executable runs a model (llama.cpp in process)
        env:
          HFL_LLM_LIBRARY: llama-cpp
        run: python scripts/platform_check.py --hfl dist/hfl${{ matrix.platform == 'windows' && '.exe' || '' }} --expect-backend llama.cpp

      - name: Rename artifact (Unix)
        if: matrix.platform != 'windows'
        run: |
          mv dist/hfl dist/${{ matrix.artifact_name }}

      - name: Rename artifact (Windows)
        if: matrix.platform == 'windows'
        run: |
          mv dist/hfl.exe dist/${{ matrix.artifact_name }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}${{ matrix.platform == 'windows' && '.exe' || '' }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.version != 'dev' }}
    permissions:
      contents: write  # required for softprops/action-gh-release to create the release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # The SBOM: every Python package a `pip install hfl` of this release
      # brings, as CycloneDX JSON, attached to the release.
      - uses: actions/checkout@v7
        with:
          path: src

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: SBOM (CycloneDX)
        run: |
          python -m venv /tmp/sbom-tool && /tmp/sbom-tool/bin/pip install -q cyclonedx-bom
          python -m venv /tmp/sbom-target && /tmp/sbom-target/bin/pip install -q ./src
          mkdir -p artifacts/sbom
          /tmp/sbom-tool/bin/cyclonedx-py environment --output-format JSON \
            --output-file "artifacts/sbom/hfl-${{ inputs.version }}.cdx.json" /tmp/sbom-target/bin/python
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['bomFormat']=='CycloneDX' and len(d['components'])>10, d.get('bomFormat')" "artifacts/sbom/hfl-${{ inputs.version }}.cdx.json"

      - name: Create checksums
        run: |
          cd artifacts
          find . -type f \( -name "hfl-*" \) -exec sha256sum {} \; > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: hfl ${{ inputs.version }}
          draft: true
          files: |
            artifacts/hfl-linux-x86_64/*
            artifacts/hfl-macos-x86_64/*
            artifacts/hfl-macos-arm64/*
            artifacts/hfl-windows-x86_64/*
            artifacts/sbom/*
            artifacts/checksums.txt
          body: |
            ## hfl ${{ inputs.version }}

            ### Downloads

            | Platform | Architecture | File |
            |----------|-------------|------|
            | Linux | x86_64 | `hfl-linux-x86_64` |
            | macOS | x86_64 (Intel) | `hfl-macos-x86_64` |
            | macOS | arm64 (Apple Silicon) | `hfl-macos-arm64` |
            | Windows | x86_64 | `hfl-windows-x86_64.exe` |

            ### Installation

            **Linux/macOS:**
            ```bash
            chmod +x hfl-*
            sudo mv hfl-* /usr/local/bin/hfl
            ```

            **Windows:**
            Move `hfl-windows-x86_64.exe` to a folder in your PATH, or run directly.

            ### Verify checksums
            ```bash
            sha256sum -c checksums.txt
            ```
