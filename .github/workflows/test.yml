name: Tests

on:
  workflow_dispatch:  # Solo ejecución manual

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov

      # See ci.yml: the coverage floor is the gate; the Codecov upload was
      # dead weight (tokenless uploads are rejected, and the failure was
      # swallowed by fail_ci_if_error: false).
      - name: Run tests with coverage
        run: |
          pytest --cov=hfl --cov-report=term-missing --cov-fail-under=80
