# Build + sign the Windows MSI on v* release tags.
#
# Pipeline:
#   1. Build a one-file PyInstaller executable (``dist/hfl.exe``).
#   2. Render the WiX recipe with the release version.
#   3. Run ``candle`` + ``light`` to produce the MSI.
#   4. Sign with an Authenticode certificate stored in
#      ``WINDOWS_CODE_SIGN_CERT`` (pfx base64) + ``…_PASSWORD``.
#   5. Upload as a release asset + refresh the WinGet manifest.
#
# The signing step is gated on the cert secrets being present so the
# build can still validate structure on forks.

name: Windows MSI

on:
  # Tag trigger intentionally removed: no automatic MSI build/publish. Run
  # manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest
    # Whether code signing is configured, as a job-level flag: GitHub
    # documents that secrets cannot be referenced directly in `if:`.
    env:
      CAN_SIGN: ${{ secrets.WINDOWS_CODE_SIGN_CERT != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build pyinstaller
          choco install wixtoolset --no-progress -y

      # llama-cpp-python's prebuilt CPU wheel: built for any x86-64 CPU. A
      # build on the runner can target the runner's CPU and stop with an
      # illegal instruction on another one.
      - name: Build PyInstaller executable
        env:
          HFL_PYI_ICON: packaging\windows\hfl.ico
          HFL_PYI_LLAMA_CPP: build\llama.cpp
        run: |
          pip install --only-binary=llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu -e ".[llama]"
          # llama.cpp's llama-server, bundled (the pinned Vulkan build, which
          # carries the CPU backends too; sha256 checked): GGUF models answer
          # several requests at once, on any GPU or none.
          python scripts/fetch_llama_server.py build\llama.cpp
          pyinstaller hfl.spec --clean

      # The 0.22.0 executables and DMG could not run any model (llama.cpp's
      # libraries were not in the binary). Run one, for real, before packaging:
      # by the bundled llama-server (the default), then by llama.cpp in process.
      - name: Check the executable runs a model (bundled llama-server)
        run: python scripts/platform_check.py --hfl dist\hfl.exe --expect-backend llama-server

      - name: Check the executable runs a model (llama.cpp in process)
        env:
          HFL_LLM_LIBRARY: llama-cpp
        run: python scripts/platform_check.py --hfl dist\hfl.exe --expect-backend llama.cpp

      - name: Derive version
        id: ver
        run: |
          $ref = $env:GITHUB_REF_NAME
          if ($ref -match '^v\d') {
            $version = $ref.TrimStart('v')
          } else {
            # Manual/test dispatch on a branch (not a v* tag): take the
            # version from pyproject so the MSI is still named correctly.
            $m = Select-String -Path pyproject.toml -Pattern '^version = "(.+)"' |
                 Select-Object -First 1
            $version = $m.Matches[0].Groups[1].Value
          }
          echo "version=$version" >>"$env:GITHUB_OUTPUT"
          Write-Host "Resolved MSI version: $version (ref=$ref)"

      - name: Render wxs
        run: |
          (Get-Content packaging\windows\hfl.wxs -Raw) `
              -replace '@HFL_VERSION@', '${{ steps.ver.outputs.version }}' |
          Set-Content packaging\windows\hfl.rendered.wxs

      - name: Build MSI
        run: |
          # Locate the WiX v3 bin dir rather than hard-coding "v3.14": the
          # choco package version can move, and a wrong path is a silent
          # break. Fail loudly if candle.exe can't be found.
          $wixBin = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset*" -ErrorAction SilentlyContinue |
                    ForEach-Object { Join-Path $_.FullName "bin" } |
                    Where-Object { Test-Path (Join-Path $_ "candle.exe") } |
                    Select-Object -First 1
          if (-not $wixBin) {
            throw "WiX candle.exe not found under 'C:\Program Files (x86)\WiX Toolset*'. Did choco install WiX v3?"
          }
          Write-Host "Using WiX bin: $wixBin"
          # -arch x64: in WiX v3 the *component* bitness (and the
          # ProgramFiles64Folder mapping) is driven by candle's -arch
          # switch, NOT by Package/@Platform. Without it components default
          # to 32-bit and ICE80 fires against the 64-bit install dir.
          & "$wixBin\candle.exe" -arch x64 -out dist\hfl.wixobj packaging\windows\hfl.rendered.wxs
          & "$wixBin\light.exe" -ext WixUIExtension `
             -out dist\hfl-${{ steps.ver.outputs.version }}.msi dist\hfl.wixobj

      - name: Decode code-sign certificate
        if: env.CAN_SIGN == 'true'
        env:
          WINDOWS_CODE_SIGN_CERT: ${{ secrets.WINDOWS_CODE_SIGN_CERT }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CODE_SIGN_CERT)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", $bytes)

      - name: Sign MSI
        if: env.CAN_SIGN == 'true'
        env:
          WINDOWS_CODE_SIGN_CERT: ${{ secrets.WINDOWS_CODE_SIGN_CERT }}
          WINDOWS_CODE_SIGN_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_PASSWORD }}
        run: |
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" `
             sign /fd sha256 /tr http://timestamp.sectigo.com /td sha256 `
             /f "$env:RUNNER_TEMP\codesign.pfx" /p $env:WINDOWS_CODE_SIGN_PASSWORD `
             dist\hfl-${{ steps.ver.outputs.version }}.msi

      - name: Verify the signature
        # With a certificate configured, an unsigned MSI must not ship.
        if: env.CAN_SIGN == 'true'
        run: |
          $sig = Get-AuthenticodeSignature dist\hfl-${{ steps.ver.outputs.version }}.msi
          if ($sig.Status -ne 'Valid') { throw "MSI signature: $($sig.Status)" }

      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: hfl-msi
          path: dist/hfl-*.msi

      - name: Attach to release
        # Only attach on a real version tag. A manual/test dispatch on a
        # branch still builds + uploads the artefact above, but must not
        # create a junk "main" GitHub Release.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/hfl-*.msi
